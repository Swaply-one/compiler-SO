<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwaplyOne - Server Unreachable</title>
  <style>
    :root {
      --bg-dark:       #121814;
      --accent-green:  #228B22;
      --accent-cyber:  #4ade80;
      --accent-red:    #ef4444;
      --text-main:     #f8fafc;
      --text-muted:    #cbd5e1;
      --font-sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono:     'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #121814;
      color: var(--text-main);
      font-family: var(--font-sans);
      user-select: none;
    }
    .swaply-server-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 38%, #19251e 0%, #121814 62%, #0d120f 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 48px;
    }
    .swaply-server-bg-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 18% 45%, rgba(74, 222, 128, 0.09) 0%, transparent 50%),
        radial-gradient(circle at 82% 45%, rgba(34, 139, 34, 0.12) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
    }
    .swaply-server-grid-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-size: 48px 48px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      mask-image: radial-gradient(circle at 50% 45%, black 50%, transparent 85%);
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
      touch-action: none;
    }
    .swaply-server-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .swaply-brand-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: 18px;
      color: #fff;
    }
    .swaply-server-status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 100px;
      background: rgba(22, 32, 26, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
      backdrop-filter: blur(14px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
    .server-indicator-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 10px var(--accent-red);
    }
    .server-indicator-dot.is-restored {
      background: var(--accent-cyber);
      box-shadow: 0 0 12px var(--accent-cyber);
    }
    .node-physical-label {
      position: absolute;
      z-index: 10;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 6px 14px;
      border-radius: 6px;
      backdrop-filter: blur(12px);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    .node-client-label {
      top: 24%;
      left: 14%;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(74, 222, 128, 0.45);
      color: #86efac;
    }
    .node-server-label {
      top: 24%;
      right: 14%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      transition: all 0.3s ease;
    }
    .node-server-label.is-restored {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(74, 222, 128, 0.45);
      color: #86efac;
    }
    .swaply-server-main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      width: 100%;
      max-width: 820px;
      margin: 0 auto 12px auto;
      pointer-events: none;
    }
    .swaply-server-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 680px;
      pointer-events: none;
      background: rgba(18, 24, 20, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 16px 28px;
      border-radius: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .swaply-server-hero.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .server-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      margin-bottom: 8px;
      display: inline-block;
    }
    .swaply-server-heading {
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    .swaply-server-support-primary {
      font-size: 15px;
      font-weight: 500;
      color: #cbd5e1;
    }
    .swaply-server-footer {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #64748b;
      pointer-events: none;
    }
    .alert-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(22, 30, 25, 0.95);
      border: 1px solid rgba(74, 222, 128, 0.45);
      color: #86efac;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 10px 22px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.2, 1.4, 0.35, 1);
      z-index: 999;
    }
    .alert-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="swaply-server-wrapper">
    <div class="swaply-server-bg-glow" aria-hidden="true"></div>
    <div class="swaply-server-grid-lines" aria-hidden="true"></div>

    <!-- 3D Physical Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Machine Status Labels -->
    <div class="node-physical-label node-client-label">
      <span>●</span> CLIENT ONLINE
    </div>

    <div id="node-server-label" class="node-physical-label node-server-label">
      <span>●</span> SWAPLYONE SERVER ONLINE
    </div>

    <!-- Top Header Bar -->
    <header class="swaply-server-header">
      <div class="swaply-brand-badge">
        <img src="/swaply-favicon-bgl.png" alt="SwaplyOne" width="34" height="34" style="border-radius: 6px; display: block;" />
        <span>SwaplyOne</span>
      </div>

      <div class="swaply-server-status-badge">
        <span id="server-indicator-dot" class="server-indicator-dot is-restored"></span>
        <span id="status-badge-text">LINK ACTIVE // COMMUNICATING</span>
      </div>
    </header>

    <!-- Main Hero Overlay (Auto dissolves after 3.8s) -->
    <main class="swaply-server-main">
      <div id="hero-overlay" class="swaply-server-hero">
        <div class="server-tag-row">
          <span class="server-tag">0x503 // CONNECTION_SEVERED</span>
        </div>
        <h1 class="swaply-server-heading">SERVER UNREACHABLE</h1>
        <p class="swaply-server-support-primary">The physical connection between the client terminal and the compiler server was severed.</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="swaply-server-footer">
      <div>PHYSICAL PORT // SEC_RACK_01</div>
      <div>DRAG PLUG TO RECONNECT</div>
    </footer>
  </div>

  <div id="alert-toast" class="alert-toast"></div>

  <!-- Zero-dependency Standalone Bundle -->
  <script src="/assets/server-unreachable.bundle.js"></script>
</body>
</html>
